name: Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          # No password at all, so there is no credential to hardcode. The
          # container is created and destroyed inside this job and is never
          # reachable from outside it.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --optimize-autoloader
      - name: Install WordPress test suite
        # The service container already created wordpress_test, so skip creation.
        run: bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 latest true
      - name: Test
        run: composer test
